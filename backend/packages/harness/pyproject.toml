[project]
name = "erpflow-harness"
version = "0.1.0"
description = "erpflow agent harness: graph, tools, sandbox, memory, ERP integration"
requires-python = ">=3.13"
dependencies = [
    # --- Agent 编排 ---
    "deepagents>=0.7,<0.8",
    "langchain>=1.3.0",
    "langchain-core>=1.0.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-mongodb>=0.2.0",
    # --- LangGraph Server（uv run langgraph）---
    "langgraph-api>=0.7.0,<0.8.0",
    "langgraph-cli>=0.4.14",
    "langgraph-runtime-inmem>=0.22.1",
    # --- 沙箱 / 工具 ---
    "docker>=7.0.0",
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pymongo>=4.8.0",
    # --- 基础 ---
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erpflow"]
